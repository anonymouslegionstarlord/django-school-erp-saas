services:
  - type: web
    name: django-school-erp-saas
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: django-school-erp-saas
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString

databases:
  - name: school-erp-db
    plan: free
