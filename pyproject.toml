[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["core/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["core", "config"]
omit = ["core/migrations/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
