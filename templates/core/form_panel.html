<details class="form-panel" {% if form.errors %}open{% endif %}>
  <summary>{{ form_title }}</summary>
  <form method="post" class="stack-form form-grid">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>
    {% endfor %}
    <button class="button" type="submit">Save</button>
  </form>
</details>
