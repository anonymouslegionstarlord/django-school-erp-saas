services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maintainiq
      POSTGRES_USER: maintainiq
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://maintainiq:local-development-only@db:5432/maintainiq
      DJANGO_SECRET_KEY: docker-development-key-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
