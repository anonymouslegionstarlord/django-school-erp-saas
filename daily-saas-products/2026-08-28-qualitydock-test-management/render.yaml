services:
  - type: web
    name: qualitydock-qa
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qualitydock-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: qualitydock-qa.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://qualitydock-qa.onrender.com

databases:
  - name: qualitydock-db
    plan: free
