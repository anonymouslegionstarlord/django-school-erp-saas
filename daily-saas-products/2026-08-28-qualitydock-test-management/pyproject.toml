[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["qa/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
source = ["qa"]
omit = ["*/migrations/*", "*/management/*", "*/admin.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
