{% extends "base.html" %}
{% block title %}New product · QualityDock{% endblock %}
{% block content %}
<div class="page-head compact"><div><a class="back" href="{% url 'product_list' %}">← Products</a><h1>Add a product</h1><p>Create an isolated quality portfolio for an application or service.</p></div></div><section class="panel form-panel narrow"><form method="post" class="stack-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }} {{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<div class="form-actions"><a class="button ghost" href="{% url 'product_list' %}">Cancel</a><button class="button">Create product</button></div></form></section>
{% endblock %}
