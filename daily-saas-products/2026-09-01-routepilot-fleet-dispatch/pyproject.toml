[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "migrations", "staticfiles", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["dispatch"]
omit = ["dispatch/migrations/*", "dispatch/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
