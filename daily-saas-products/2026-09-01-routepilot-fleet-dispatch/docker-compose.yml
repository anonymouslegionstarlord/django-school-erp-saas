services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routepilot
      POSTGRES_USER: routepilot
      POSTGRES_PASSWORD: routepilot-local-only
    volumes:
      - routepilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://routepilot:routepilot-local-only@db:5432/routepilot
      DJANGO_SECRET_KEY: docker-development-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  routepilot_postgres:
