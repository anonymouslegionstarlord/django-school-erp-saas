services:
  - type: web
    name: controlbridge
    runtime: python
    rootDir: daily-saas-products/2026-09-14-controlbridge-audit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: controlbridge-db, property: connectionString}
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: controlbridge.onrender.com
databases:
  - name: controlbridge-db
    databaseName: controlbridge
    user: controlbridge
