services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlbridge
      POSTGRES_USER: controlbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [controlbridge_data:/var/lib/postgresql/data]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://controlbridge:${POSTGRES_PASSWORD}@db:5432/controlbridge
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your environment}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  controlbridge_data:
