[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["risk/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001"]

[tool.coverage.run]
source = ["risk"]
omit = [
  "risk/admin.py",
  "risk/apps.py",
  "risk/migrations/*",
]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true
