services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privacydesk
      POSTGRES_USER: privacydesk
      POSTGRES_PASSWORD: privacydesk-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacydesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [privacydesk_data:/var/lib/postgresql/data]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://privacydesk:privacydesk-local@db:5432/privacydesk
      DJANGO_SECRET_KEY: docker-development-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  privacydesk_data:
