[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.coverage.run]
source = ["privacy"]
omit = ["*/migrations/*", "*/management/*", "privacy/admin.py", "privacy/apps.py"]

[tool.coverage.report]
fail_under = 88
show_missing = true
