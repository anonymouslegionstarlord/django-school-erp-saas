services:
  - type: web
    name: deskpulse-helpdesk
    runtime: docker
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: deskpulse-db, property: connectionString}
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
databases:
  - name: deskpulse-db
    plan: free
