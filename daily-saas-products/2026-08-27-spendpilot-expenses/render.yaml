services:
  - type: web
    name: spendpilot-expenses
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendpilot-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: spendpilot-expenses.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://spendpilot-expenses.onrender.com

databases:
  - name: spendpilot-db
    plan: free
