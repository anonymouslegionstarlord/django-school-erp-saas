services:
  - type: web
    name: skillharbor-lms
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillharbor-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: skillharbor-lms.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://skillharbor-lms.onrender.com

databases:
  - name: skillharbor-db
    plan: free
