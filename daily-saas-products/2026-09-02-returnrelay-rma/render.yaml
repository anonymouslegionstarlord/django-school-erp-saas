services:
  - type: web
    name: returnrelay
    runtime: python
    plan: free
    rootDir: daily-saas-products/2026-09-02-returnrelay-rma
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: returnrelay-db
          property: connectionString

databases:
  - name: returnrelay-db
    plan: free
    databaseName: returnrelay
    user: returnrelay
